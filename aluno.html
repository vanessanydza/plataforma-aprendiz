<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro do Aluno</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/validacao.js"></script>
</head>
<body>

<nav class="top-nav">
  <div style="max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 0 20px;">
    
    <a href="index.html" class="btn-voltar">← Voltar</a>

    <button onclick="logout()" class="btn-voltar" style="background: var(--escuro); color: white; margin: 0;">Sair</button>
  </div>

  <script>
  function logout() {
      localStorage.removeItem("usuarioLogado");
      window.location.href = "login.html";
  }
  </script>
</nav>

<main class="aluno-container">

  <h2>Cadastro do Aluno</h2>

  <p class="mensagem">
    Você não precisa ter experiência. Este espaço é para mostrar quem você é
    e o que quer aprender.
  </p>

  <form id="formAluno">
    <input type="text" id="nome" placeholder="Nome Completo" required>
    <input type="number" id="idade" placeholder="Idade" required>
    <input type="text" id="cpf" placeholder="CPF" required>
    <input type="text" id="endereco" placeholder="Endereço, nº, Bairro" required>
    <input type="email" id="email" placeholder="E-mail" required>
    <input type="tel" id="celular" class="input-padrao" placeholder="(00) 00000-0000" required>
    <input type="text" id="curso_periodo" placeholder="Curso / Período" required>
    <input type="text" id="idiomas" placeholder="Idiomas (opcional)">

    <input type="text" id="area" list="areasSugestao" placeholder="Área de interesse (Selecione ou digite)" required>
    <datalist id="areasSugestao">
        <option value="Marketing"></option>
        <option value="Finanças"></option>
        <option value="Recursos Humanos"></option>
        <option value="TI (Tecnologia da Informação)"></option>
        <option value="Administração"></option>
        <option value="Design"></option>
        <option value="Jurídico"></option>
        <option value="Operações"></option>
        <option value="Vendas"></option>
    </datalist>

    <input type="text" id="habilidades" placeholder="Habilidades (ex: Excel, Comunicação) (opcional)">
    <button type="submit">Cadastrar</button>
</form>


  <section class="cursos-tags">
    <h3>Não tem experiência ainda?</h3>
    <p>Esses cursos, ajudam a dar o primeiro passo:</p>

    <div class="tags">
      <a href="https://www.cursoemvideo.com/" target="_blank">Curso em Vídeo</a>
      <a href="https://www.ev.org.br/" target="_blank">Fundação Bradesco</a>
      <a href="https://www.alura.com.br/imersoes" target="_blank">Alura</a>
    </div>
  </section>

</main>

<script src="js/alunos.js"></script>
</body>
</html>
