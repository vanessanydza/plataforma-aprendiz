<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Escola</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/validacao.js"></script>
</head>
<body>
<nav class="top-nav">
  <div style="max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 0 20px;">
    
    <a href="index.html" class="btn-voltar">← Voltar</a>

    <button onclick="logout()" class="btn-voltar" style="background: var(--escuro); color: white; margin: 0;">Sair</button>
  </div>

  <script>
    function logout() {
        localStorage.removeItem("usuarioLogado");
        localStorage.removeItem("alunoSelecionado");
        window.location.href = "login.html";
    }
  </script>
</nav>

  <h2>Panorama da Escola</h2>

  <div class="box dashboard">
    <h3>Panorama Geral (Alunos)</h3>
    <div style="display: flex; justify-content: center; gap: 15px; margin-bottom: 20px;">
      <button onclick="alternarGrafico('areas')" class="btn-voltar" id="btnAreas">Ver Áreas</button>
      <button onclick="alternarGrafico('habilidades')" class="btn-voltar" id="btnHabs">Habilidades Técnicas</button>
    </div>

    <div class="grafico-container" style="position: relative; height:35vh; width:100%">
        <canvas id="graficoEscola"></canvas>
    </div>
</div>

<div class="box dashboard" style="margin-top: 20px;">
    <h3>Média Pedagógica da Turma (Soft Skills)</h3>
    <div class="grafico-container" style="position: relative; height:40vh; width:100%">
        <canvas id="graficoPedagogico"></canvas>
    </div>
</div>

  <div class="box">
    <h3>Avaliação Individual</h3>
    <p>Selecione o aluno para gerenciar a nota pedagógica:</p>
    
    <div style="display: flex; gap: 10px; margin-top: 15px;">
      <select id="selectAlunoEscola" style="flex: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--roxo); font-size: 1rem;">
        <option value="">Escolha um aluno...</option>
      </select>
      
      <button onclick="irParaAvaliacao()" class="btn-voltar" style="margin: 0;">Avaliar</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
